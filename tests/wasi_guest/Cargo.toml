[package]
name = "wasi_guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { path = "../..", default-features = false, features = ["json", "multipart", "stream"] }
serde_json = "1"
wasip3 = { version = "0.10", features = ["http-compat"] }
